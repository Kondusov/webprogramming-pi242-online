<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мессенджер</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран входа -->
<div id="authScreen">
    <div id="authMain">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
        <form id="authForm">
            <input id="authEmail" type="email">
            <input id="authUsername" type="text" required>
            <input id="authPassword" type="password" required>
            <button type="submit" id="authSubmit">Войти</button>
            <button type="button" id="forgotBtn">Забыли пароль?</button>
        </form>
        <div id="authError"></div>
    </div>

    <div id="verifyScreen" class="hidden">
        <b id="verifyEmailLabel"></b>
        <form id="verifyForm">
            <input id="verifyCode">
            <button type="submit">Подтвердить</button>
            <button type="button" id="resendBtn">Отправить код повторно</button>
            <button type="button" id="backBtn">← Назад</button>
        </form>
        <div id="verifyError"></div>
    </div>

    <div id="resetScreen" class="hidden">
        <form id="resetRequestForm">
            <input id="resetEmail" type="email">
            <button type="submit">Отправить код</button>
            <button type="button" data-back>← Назад</button>
        </form>
        <form id="resetConfirmForm" class="hidden">
            <input id="resetCode">
            <input id="resetPassword" type="password">
            <button type="submit">Сменить пароль</button>
        </form>
        <div id="resetError"></div>
    </div>
</div>

<div id="app" class="hidden">
    <aside class="sidebar">
        <span id="meName"></span>
        <button id="logoutBtn">⎋</button>
        <button id="newGroupBtn">+ Группа</button>
        <button id="newChannelBtn">+ Канал</button>
            <button id="newDmBtn">+ Личный</button>
            <input id="chatFilter">
        <ul id="chatList"></ul>
    </aside>
    <main class="main">
        <div id="chatName">Выберите чат</div>
        <div id="chatSub"></div>
        <button id="voiceCallBtn" class="hidden">📞</button>
        <button id="videoCallBtn" class="hidden">📹</button>
        <button id="membersBtn" class="hidden">👥</button>
        <button id="searchMsgBtn" class="hidden">🔍</button>
        <div id="messages"></div>
        <div id="typingIndicator" class="hidden"></div>
        <form id="composer" class="hidden">
            <input id="messageInput">
            <button type="submit">Отправить</button>
        </form>
        <div id="emptyState">← Выберите или создайте чат</div>
    </main>
</div>


<!-- Звонки -->
<div id="incomingCallModal" class="modal hidden">
    <h3 id="incomingFrom">Входящий звонок</h3>
    <p id="incomingType"></p>
    <button id="acceptCall">Принять</button>
    <button id="rejectCall">Отклонить</button>
</div>

<div id="callScreen" class="hidden">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="callInfo"></div>
    <button id="toggleMic">🎙</button>
    <button id="toggleCam">📹</button>
    <button id="hangupBtn">📵</button>
</div>

<!-- Основной интерфейс -->
<div class="app hidden" id="app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="me" id="meName">—</span>
            <button class="icon-btn" id="logoutBtn" title="Выйти">⎋</button>
        </div>

        <div class="actions">
            <button class="action-btn" id="newGroupBtn" title="Создать группу">+ Группа</button>
            <button class="action-btn" id="newChannelBtn" title="Создать канал">+ Канал</button>
            <button class="action-btn" id="newDmBtn" title="Личный чат">+ Личный</button>
        </div>

        <div class="search">
            <input id="chatFilter" type="text" placeholder="Поиск чата…">
        </div>

        <ul class="chat-list" id="chatList"></ul>
    </aside>

    <main class="main">
        <header class="main-header">
            <div>
                <div class="chat-name" id="chatName">Выберите чат</div>
                <div class="chat-sub" id="chatSub"></div>
            </div>
            <div class="header-actions">
                <button class="icon-btn hidden" id="membersBtn" title="Участники">👥</button>
                <button class="icon-btn hidden" id="searchMsgBtn" title="Поиск сообщений">🔍</button>
            </div>
        </header>

        <div class="messages" id="messages"></div>

        <div class="typing-indicator hidden" id="typingIndicator"></div>

        <form class="composer hidden" id="composer">
            <input id="messageInput" type="text" placeholder="Написать сообщение…" autocomplete="off" maxlength="4000">
            <button type="submit">Отправить</button>
        </form>

        <div class="empty-state" id="emptyState">← Выберите или создайте чат</div>
    </main>
</div>

<!-- Модалка: участники -->
<div class="modal hidden" id="membersModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Участники</h3>
            <button class="icon-btn" data-close>✕</button>
        </div>
        <ul class="members-list" id="membersList"></ul>
        <div class="modal-footer">
            <input id="addMemberInput" placeholder="Имя пользователя">
            <button id="addMemberBtn">Добавить</button>
        </div>
    </div>
</div>

<!-- Модалка: поиск сообщений -->
<div class="modal hidden" id="searchModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Поиск в чате</h3>
            <button class="icon-btn" data-close>✕</button>
        </div>
        <div class="modal-footer">
            <input id="searchMsgInput" placeholder="Что искать…">
            <button id="searchMsgGo">Найти</button>
        </div>
        <ul class="search-results" id="searchResults"></ul>
    </div>
</div>

<!-- Модалка: создание DM -->
<div class="modal hidden" id="dmModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Личный чат</h3>
            <button class="icon-btn" data-close>✕</button>
        </div>
        <div class="modal-footer">
            <input id="dmSearchInput" placeholder="Имя пользователя">
            <button id="dmSearchGo">Найти</button>
        </div>
        <ul class="search-results" id="dmSearchResults"></ul>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
